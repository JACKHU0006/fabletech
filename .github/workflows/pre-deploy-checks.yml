name: Pre-Deploy Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Astro site
        run: npm run build
        env:
          CDN_URL: https://cdn.example.com
          PUBLIC_CDN_URL: https://cdn.example.com
      
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: Build output directory 'dist' not found!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html not found!"
            exit 1
          fi
          echo "Build verification passed!"
          echo "Files in dist directory:"
          ls -la dist/
      
      - name: Check for broken links (basic)
        run: |
          echo "Checking for broken links in HTML files..."
          # Simple check for common broken link patterns
          BROKEN_LINKS=$(grep -r "href=\"http\"\|href=\"https\"" dist/ || true)
          if [ -n "$BROKEN_LINKS" ]; then
            echo "Found external links (not an error, just informational):"
            echo "$BROKEN_LINKS"
          fi
          echo "Link check completed!"
      
      - name: Check file sizes
        run: |
          echo "Checking file sizes..."
          LARGE_FILES=$(find dist/ -type f -size +500k -exec ls -lh {} \;)
          if [ -n "$LARGE_FILES" ]; then
            echo "Warning: Found large files (>500KB):"
            echo "$LARGE_FILES"
          else
            echo "All files are reasonably sized!"
          fi
      
      - name: Validate HTML structure (basic)
        run: |
          echo "Validating basic HTML structure..."
          HTML_FILES=$(find dist/ -name "*.html")
          for file in $HTML_FILES; do
            if ! grep -q "<!DOCTYPE html>" "$file"; then
              echo "Warning: $file missing DOCTYPE declaration"
            fi
            if ! grep -q "<html" "$file" && ! grep -q "<html>" "$file"; then
              echo "Warning: $file missing html tag"
            fi
          done
          echo "HTML structure check completed!"
      
      - name: Summary
        run: |
          echo "============================================="
          echo "All pre-deploy checks completed successfully!"
          echo "============================================="
          echo "Build output size:"
          du -sh dist/
